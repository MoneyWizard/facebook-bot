name: Autonomous Bot Cloud Schedule

on:
  schedule:
    # Run automatically every 4 hours around the clock on GitHub's cloud servers
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-autopilot:
    name: Cloud Auto-Pilot Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers & Linux System Dependencies
        timeout-minutes: 5
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium || (sleep 5 && npx playwright install-deps chromium)
          else
            npx playwright install --with-deps chromium || (sleep 5 && npx playwright install --with-deps chromium)
          fi

      - name: Inject Environment Secrets & Session Cookies
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SESSION_COOKIES_JSON: ${{ secrets.SESSION_COOKIES_JSON }}
          TIKTOK_COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          mkdir -p cookies data logs
          echo "OPENAI_API_KEY=${OPENAI_API_KEY}" > .env
          echo "PORT=3500" >> .env
          echo "HEADLESS=true" >> .env
          if [ -n "${PROXY_URL}" ]; then
            echo "PROXY_URL=${PROXY_URL}" >> .env
          fi
          if [ -n "${SESSION_COOKIES_JSON}" ]; then
            printf '%s' "${SESSION_COOKIES_JSON}" > cookies/session.json
            echo "Facebook session cookies injected into cloud runner."
          fi
          if [ -n "${TIKTOK_COOKIES_JSON}" ]; then
            printf '%s' "${TIKTOK_COOKIES_JSON}" > cookies/tiktok_session.json
            echo "TikTok session cookies injected into cloud runner."
          fi

      - name: Execute Autonomous Auto-Pilot Cycle
        run: node scripts/cloud-cycle.js

      - name: Commit Updated Database State Back to Repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/contractor-leads.csv data/predator-leads.csv data/audience-metrics.json || true
          if ! git diff --staged --quiet; then
            git commit -m "auto: update database state after cloud run"
            git pull --rebase origin master || true
            git push origin master || true
          fi
